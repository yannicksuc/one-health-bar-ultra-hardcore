name: Bug
description: Something does not work as expected / Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens / Ce qui se passe
      description: What you did, what happened, what you expected. / Ce que tu as fait, ce qui s'est passé, ce que tu attendais.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mod version / Version du mod
      placeholder: "1.1.0"
  - type: dropdown
    id: where
    attributes:
      label: Where / Où
      options:
        - Singleplayer / Solo
        - LAN / Réseau local
        - Dedicated server / Serveur dédié
        - Modpack
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshot / Logs ou capture
      description: logs/latest.log, a crash report or a screenshot. / Le fichier logs/latest.log, un crash report ou une capture.
